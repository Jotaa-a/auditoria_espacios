
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sistema de Auditoría</title>

    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>

    <main class="login-container">

        <div class="login-card">
            <div class="login-banner">
                <div id="login-animation" aria-hidden="true"></div>
            </div>

            <div class="login-content">


                <h1>Bienvenido</h1>
                <p class="subtitle">Sistema de Auditoría de Espacios</p>

                <form id="loginForm">

                    <div class="input-group">
                        <span class="input-icon">✉</span>
                        <input
                            type="text"
                            id="usuario"
                            placeholder="Usuario o correo"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <span class="input-icon">⌑</span>
                        <input
                            type="password"
                            id="password"
                            placeholder="Contraseña"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div class="login-options">

                        <a href="#" class="forgot-password">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>

                    <button type="submit" class="login-btn">
                        Iniciar sesión
                    </button>

                    <p id="mensaje" class="mensaje" role="status"></p>

                </form>

                <p class="login-footer">
                    Control · Inspección · Auditoría
                </p>

            </div>
        </div>

    </main>

    <script defer src="index.js"></script>
</body>
</html>
