spring.application.name=auditoria_espacios
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=America/Bogota
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.config.import=optional:file:.env[.properties]

app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiracion-minutos=480
app.admin.correo=${APP_ADMIN_CORREO}
app.admin.password=${APP_ADMIN_PASSWORD}
app.cors.origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173
# app.cors.origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://172.16.106.20:5173

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true